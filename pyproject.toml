[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quassar-risk"
version = "0.1.0"
description = "Research-grade risk primitives with explicit conventions"
requires-python = ">=3.11"
license = {text = "Proprietary"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
