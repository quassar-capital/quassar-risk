name: Research Navigation Integrity

on:
  push:
  pull_request:

jobs:
  validate-research-navigation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate research catalog and README
        run: |
          python research_catalog/generate.py
          git diff --exit-code -- README.md
